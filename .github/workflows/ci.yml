name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Pruebas unitarias (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Las pruebas unitarias no necesitan el binario de Electron; se omite la descarga de 188 MB para acelerar el CI
      - name: Instalar dependencias
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Ejecutar pruebas
        run: npm test

      # Ejecuta directamente el callback del gancho C# incrustado en agent.ps1, para que no se rompa la asignación de teclas
      - name: Prueba rápida de la lógica del gancho del ratón
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }
