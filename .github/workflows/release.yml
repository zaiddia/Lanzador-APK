name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar la versión portátil y publicar
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias (incluye el runtime de Electron)
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Empaquetar la versión portátil
        run: npm run pack

      # Se usa 7-Zip en lugar de Compress-Archive: con la misma carpeta, el deflate de .NET da 105 MB,
      # 7-Zip -mx=9 solo 99,6 MB; esos 5 MB decidían si la versión publicada era «un zip que se descomprime directamente»
      # o «dos partes que hay que unir a mano». build/zip.js además tiene un límite de tamaño: si pasa de
      # 100 MiB el job falla, para no volver sin darnos cuenta a paquetes en partes.
      - name: Comprimir los artefactos (7-Zip, límite de tamaño 100 MiB)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/LanzadorAPK-win64-portable "LanzadorAPK-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "LanzadorAPK-$tag-win64-portable.zip" | Select-Object Name, Length

      # Crea el Release y sube la versión portátil ligera (envoltorio mínimo; el runtime se descarga en el primer arranque)
      - name: Crear el release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "LanzadorAPK-$tag-win64-portable.zip"
          # Idempotente: si el release ya existe (relanzar el job / volver a subir la etiqueta) se omite create y solo se suben los archivos
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # Si hay notas de versión escritas a mano (.github/release-notes-<tag>.md) se usan; son más útiles que el «Full Changelog»
          # de --generate-notes; solo si no existen se generan automáticamente.
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "Lanzador APK $tag" --notes-file $notes
            } else {
              gh release create $tag --title "Lanzador APK $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "Error al subir: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'

      # Publica las sumas SHA-256: el actualizador de la app se niega a instalar
      # un paquete cuya suma no coincide con la publicada aquí.
      - name: Publicar SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/checksums.js $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  full:
    name: Compilar la versión completa (runtime incluido, lista sin conexión)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Arma el runtime desde la fuente oficial de Google (emulator + platform-tools + aehd + imagen Play x86_64).
      # Se genera en engine/, con la misma estructura que en desarrollo local.
      - name: Ensamblar el runtime
        run: node build/fetch-runtime.js engine

      # prepare-runtime comprime system.img/vendor.img en xz (LZMA2).
      # El runner de CI solo tiene 2 núcleos: XZ_PRESET=6 baja la compresión de ~2 h a ~40 min (tamaño +3 %).
      # XZ_TIMEOUT_MS es un vigilante: al agotarse el tiempo mata el proceso y usa gzip como respaldo,
      # para no repetir nunca «stdin sin EOF → salida de 0 bytes → bloqueado 3 horas».
      - name: Preparar el runtime (compresión xz, nivel reducido en CI para ir más rápido)
        run: node build/prepare-runtime.js --force
        env:
          XZ_PRESET: '6'
          XZ_TIMEOUT_MS: '3600000'

      # Incluye Microsoft VC++ 2015-2022 x64: el emulador de Android (Qt6) y qemu dependen de él;
      # si falta, en otros equipos no arrancan (0xc0000135 / falta MSVCP140).
      # Se coloca en build/runtime y entra en el instalador con extraResources; se puede instalar sin conexión.
      - name: Descargar el runtime de VC++ (incluido para uso sin conexión)
        shell: pwsh
        run: |
          $dir = "build\runtime"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
          $out = "$dir\vc_redist.x64.exe"
          Write-Output "Descargando el runtime de VC++ 2015-2022 x64…"
          curl.exe -L -o $out "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          if (-not (Test-Path $out) -or (Get-Item $out).Length -lt 1MB) { Write-Error "Falló la descarga de vc_redist" }
          Get-Item $out | Select-Object Name, Length

      # Sin etiqueta git, electron-builder no publica; con etiqueta, como este job no tiene
      # GH_TOKEN, falla con "GitHub Personal Access Token is not set" y sale con 1 (la causa de que la versión completa fallara siempre).
      # Por eso se usa --publish never; el instalador lo sube el paso «Subir versión completa al Release» con gh release upload.
      - name: Compilar el instalador de la versión completa
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Subir la versión completa al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $setup = Get-ChildItem dist/release/*Setup.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "No se encontró Setup.exe"; exit 1 }
          Write-Output ("Subiendo {0} ({1:N0} MB)" -f $setup.Name, ($setup.Length / 1MB))
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $setup.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Error al subir: $($setup.Name)"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      # La versión ligera (sin runtime) ya no descarga emulator / imagen del sistema uno por uno desde dl.google.com,
      # sino este único paquete: la fuente de descarga es la misma que la de «Actualizaciones», el Release de GitHub del proyecto,
      # así la estabilidad de red y la resolución de problemas quedan en un solo lugar.
      # El contenido ya son imágenes comprimidas en .xz; aquí se empaqueta en zip con bsdtar sin volver a comprimir (ahorra decenas de minutos).
      - name: Empaquetar el runtime completo (fuente de descarga de la versión ligera)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "LanzadorAPK-runtime-$tag.zip"
          if (-not (Test-Path "build\runtime\emulator\emulator.exe")) { Write-Error "build\runtime está incompleto"; exit 1 }
          tar.exe -a -cf $zip -C "build\runtime" .
          if ($LASTEXITCODE -ne 0) { Write-Error "Falló el empaquetado del runtime"; exit 1 }
          Get-Item $zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Subir el paquete del runtime al release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "LanzadorAPK-runtime-$tag.zip"
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 20 }
          }
          if (-not $ok) { Write-Error "Error al subir: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[] | "\(.name) \(.size)"'

      - name: Actualizar SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/checksums.js $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
