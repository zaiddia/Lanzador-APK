appId: com.lanzadorapk.win
productName: LanzadorAPK
copyright: Copyright © 2026 LanzadorAPK

directories:
  output: dist/release
  buildResources: build

# Solo los archivos necesarios para ejecutar; el código va completo (sin asar: el agente de ventanas necesita la ruta real del .ps1)
asar: false
files:
  - src/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
  - "!**/node_modules/**"
  # Para descomprimir las imágenes .xz del runtime (NAPI precompilado, sin problemas de ABI)
  - "node_modules/@napi-rs/lzma/**"
  - "node_modules/@napi-rs/lzma-win32-x64-msvc/**"
  - "!node_modules/@napi-rs/lzma/*.md"
  - "!node_modules/@napi-rs/lzma/*.ts"
  - "!node_modules/@napi-rs/lzma/browser-entry.*"

# Solo se conservan los idiomas de interfaz español e inglés (los locales de Electron pasan de 41 MB a ~3 MB)
electronLanguages:
  - es
  - es-419
  - en-US

# Runtime completo (emulator + platform-tools + imagen del sistema), generado por build/prepare-runtime.js.
# Una vez dentro del paquete, el primer arranque ya no descarga nada.
extraResources:
  - from: build/runtime
    to: runtime
    filter:
      - "**/*"
      - "!.prepared"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: src/ui/assets/appicon.ico
  # Se instala en la carpeta del usuario actual, sin escribir en el disco del sistema ni pedir permisos de administrador
  requestedExecutionLevel: asInvoker

# ---------------- Microsoft Store (MSIX) ----------------
# El destino appx no está en la lista de compilación por defecto: solo se usa para el paquete de la Store (npm run build:appx);
# normalmente npm run build:exe solo genera el instalador NSIS.
#
# identityName / publisher deben ser exactamente iguales a los de Partner Center →
#   Product management → Product identity:
#   Package/Identity/Name y Package/Identity/Publisher.
# Pon aquí los valores de tu propia cuenta de Partner Center;
# para cambiar la identidad del producto edítalos aquí (o usa LANZADORAPK_MSIX_IDENTITY / LANZADORAPK_MSIX_PUBLISHER).
# Atención: con un Publisher de marcador, la Store rechaza el paquete.
appx:
  identityName: zaiddia.LanzadorAPK
  publisher: "CN=PON-AQUI-TU-PUBLISHER-DE-PARTNER-CENTER"  # Partner Center → Product identity
  publisherDisplayName: zaiddia
  displayName: LanzadorAPK
  applicationId: LanzadorAPK
  # La única capacidad imprescindible para una app de escritorio de confianza total. No agregar unvirtualizedResources /
  # broadFileSystemAccess: la Store casi nunca los aprueba, y esta app evita la redirección de escritura de AppData
  # moviendo la carpeta de datos a %USERPROFILE%\LanzadorAPK, así que no los necesita.
  capabilities:
    - runFullTrust
  languages:
    - es-ES
    - en-US
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.22621.0

nsis:
  # Ya no es «instalación con un clic en la carpeta por defecto del disco C»: asistente estándar que permite elegir la ubicación
  # (instalar en otro disco alivia el disco C; la carpeta de datos del runtime se elige aparte en Configuración).
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  displayLanguageSelector: false
  installerLanguages:
    - es_ES
  language: "3082"
  # always: recrea el .lnk aunque ya exista uno con el mismo nombre en el escritorio.
  # el valor por defecto true solo lo crea si «no existe»; en algunos equipos (bloqueo de un programa de seguridad, escritorio
  # redirigido a OneDrive, accesos antiguos rotos que apuntan a carpetas borradas) quedaba sin icono tras instalar,
  # o el icono seguía apuntando al exe viejo. always garantiza que tras cada instalación apunte a la carpeta actual.
  createDesktopShortcut: always
  createStartMenuShortcut: true
  artifactName: LanzadorAPK-${version}-Setup.exe
  # Antes de desinstalar se terminan los procesos del runtime en ejecución, para que los archivos no queden bloqueados
  # (si una herramienta de borrado forzado no puede borrarlos, casi siempre es porque qemu/adb siguen activos).
  include: build/installer.nsh
  # El instalador ya trae el runtime completo (emulator + imagen del sistema .gz); en el primer arranque tras instalar
  # descomprime la imagen en la carpeta del usuario y después ya no descarga nada.

# Nivel de compresión: normal (zlib). Las imágenes ya vienen en xz/gz; NSIS solo comprime las dll de Electron,
# normal y maximum dan casi el mismo tamaño, pero maximum (LZMA) hace el instalador más de diez minutos más lento.
# Nota: cuando el CI ejecuta npx con PowerShell, -c.compression=xxx en línea se parte y se toma como ruta de archivo de configuración,
# por eso el nivel de compresión se fija aquí y no con -c en el workflow.
compression: normal

# ---------------- Linux / FydeOS ----------------
# Esta sección antes estaba en el campo "build" de package.json. El esquema de electron-builder 26
# ya no acepta la forma de linux.desktop, y cualquier compilación (incluida Windows) fallaba
# en la validación de la configuración. Al moverla a este archivo e indicarlo con --config electron-builder.yml,
# la configuración vieja de package.json ya no se impone.
linux:
  target:
    - AppImage
  category: Utility
  icon: src/ui/assets/logo-128.png
  desktop:
    entry:
      Name: LanzadorAPK
      Comment: Administra apps Android en FydeOS / Linux
      Categories: Utility;
